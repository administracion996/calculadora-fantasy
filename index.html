<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyHub - Chollos y Bajas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-xl text-emerald-400">
                <span>⚽</span> FantasyHub
            </div>
            <nav class="flex gap-6 text-sm font-medium text-slate-400">
                <a href="#chollos" class="hover:text-white transition">Chollos</a>
                <a href="#bajas" class="hover:text-white transition">Bajas y Dudas</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-10 space-y-12">
        <!-- Hero & Selector -->
        <div class="text-center space-y-4">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
                Elige tu Plataforma Fantasy
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto">
                Selecciona tu juego para ver valores de mercado y bajas actualizadas.
            </p>
            <div class="flex justify-center gap-3 pt-4">
                <button id="btn-biwenger" onclick="cambiarJuego('biwenger')" class="px-6 py-2.5 rounded-lg font-bold text-sm bg-emerald-500 text-slate-900 transition">Biwenger</button>
                <button id="btn-laliga" onclick="cambiarJuego('laliga')" class="px-6 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">LaLiga Fantasy</button>
                <button id="btn-comunio" onclick="cambiarJuego('comunio')" class="px-6 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Comunio</button>
            </div>
        </div>

        <!-- Chollos -->
        <section id="chollos" class="space-y-4">
            <h2 class="text-2xl font-bold flex items-center gap-2 text-white">
                🔥 Chollos y Subidas de Valor
            </h2>
            <div id="lista-chollos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se rellena con JS -->
            </div>
        </section>

        <!-- Bajas -->
        <section id="bajas" class="space-y-4">
            <h2 class="text-2xl font-bold flex items-center gap-2 text-white">
                🚨 Bajas, Dudas y Sancionados
            </h2>
            <div id="lista-bajas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se rellena con JS -->
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>© 2026 FantasyHub - Datos actualizados para Biwenger, LaLiga Fantasy y Comunio.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
