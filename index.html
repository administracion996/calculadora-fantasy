<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyHub Pro - Mercado Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-xl text-emerald-400">
                <span>⚽</span> FantasyHub Pro
            </div>
            <nav class="flex gap-3">
                <button id="btn-biwenger" onclick="cambiarJuego('biwenger')" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-500 text-slate-900">Biwenger</button>
                <button id="btn-laliga" onclick="cambiarJuego('laliga')" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-300">LaLiga Fantasy</button>
                <button id="btn-comunio" onclick="cambiarJuego('comunio')" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-300">Comunio</button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8 space-y-8">
        
        <!-- PANEL DE BÚSQUEDA Y FILTROS -->
        <section class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">🔍 Buscador y Filtros de Mercado</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Buscador -->
                <div>
                    <label class="text-xs font-semibold text-slate-400">Buscar Jugador</label>
                    <input type="text" id="filtro-nombre" oninput="aplicarFiltros()" placeholder="Ej: Yamal, Mbappé, Pedri..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Desplegable con LOS 20 EQUIPOS DE LALIGA -->
                <div>
                    <label class="text-xs font-semibold text-slate-400">Equipo (20 Clubes)</label>
                    <select id="filtro-equipo" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todos">Todos los equipos (20)</option>
                        <option value="Athletic Club">Athletic Club</option>
                        <option value="Atlético de Madrid">Atlético de Madrid</option>
                        <option value="CA Osasuna">CA Osasuna</option>
                        <option value="CD Leganés">CD Leganés</option>
                        <option value="Celta de Vigo">Celta de Vigo</option>
                        <option value="Deportivo Alavés">Deportivo Alavés</option>
                        <option value="FC Barcelona">FC Barcelona</option>
                        <option value="Getafe CF">Getafe CF</option>
                        <option value="Girona FC">Girona FC</option>
                        <option value="Rayo Vallecano">Rayo Vallecano</option>
                        <option value="RCD Espanyol">RCD Espanyol</option>
                        <option value="RCD Mallorca">RCD Mallorca</option>
                        <option value="Real Betis">Real Betis</option>
                        <option value="Real Madrid">Real Madrid</option>
                        <option value="Real Sociedad">Real Sociedad</option>
                        <option value="Real Valladolid">Real Valladolid</option>
                        <option value="Sevilla FC">Sevilla FC</option>
                        <option value="UD Las Palmas">UD Las Palmas</option>
                        <option value="Valencia CF">Valencia CF</option>
                        <option value="Villarreal CF">Villarreal CF</option>
                    </select>
                </div>

                <!-- Posición -->
                <div>
                    <label class="text-xs font-semibold text-slate-400">Posición</label>
                    <select id="filtro-posicion" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todas">Todas las posiciones</option>
                        <option value="POR">Portero (POR)</option>
                        <option value="DEF">Defensa (DEF)</option>
                        <option value="MED">Centrocampista (MED)</option>
                        <option value="DEL">Delantero (DEL)</option>
                    </select>
                </div>

                <!-- Filtro por Subida/Bajada o Precio -->
                <div>
                    <label class="text-xs font-semibold text-slate-400">Tendencia Mercado</label>
                    <select id="filtro-tendencia" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todos">Todas las tendencias</option>
                        <option value="subida">🔥 Solo Chollos en Subida</option>
                        <option value="bajada">📉 En Bajada de Precio</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- RESULTADOS EN VIVO -->
        <section class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">📋 Mercado de Jugadores</h2>
                <span id="contador-resultados" class="text-sm text-emerald-400 font-semibold">Cargando base de datos...</span>
            </div>
            
            <div id="contenedor-jugadores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Fichas renderizadas por JS -->
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
