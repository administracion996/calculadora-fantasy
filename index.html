<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chollos La Liga Fantasy - Analítica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER SUPERIOR ESTILO ANALÍTICA FANTASY -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3 font-bold text-emerald-400 text-lg">
                <span>AF</span> Analítica Fantasy
            </div>
            
            <nav class="hidden md:flex gap-6 text-xs font-semibold text-slate-300">
                <a href="#" class="hover:text-emerald-400 transition">Portada</a>
                <a href="#" class="hover:text-emerald-400 transition">La Liga</a>
                <a href="#" class="text-emerald-400 font-bold underline decoration-2 underline-offset-4">Fantasy (Relevo)</a>
            </nav>
        </div>
    </header>

    <div class="flex-1 max-w-[1600px] w-full mx-auto flex gap-4 p-4">
        
        <!-- SIDEBAR IZQUIERDO: LOS 20 EQUIPOS DE LALIGA -->
        <aside class="w-20 bg-slate-900 border border-slate-800 rounded-2xl p-2 hidden sm:flex flex-col items-center gap-2">
            <span class="text-[10px] font-bold text-slate-500 uppercase py-1">Equipos</span>
            <div class="space-y-1.5 overflow-y-auto max-h-[82vh] w-full text-center pr-0.5">
                <button onclick="filtrarEquipo('todos')" class="w-full py-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-bold rounded-xl hover:bg-emerald-500 hover:text-slate-950 transition">TODOS</button>
                <button onclick="filtrarEquipo('Athletic Club')" title="Athletic Club" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-slate-300 text-[10px] font-bold rounded-lg border border-slate-800">ATH</button>
                <button onclick="filtrarEquipo('Atlético de Madrid')" title="Atlético de Madrid" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-red-400 text-[10px] font-bold rounded-lg border border-slate-800">ATM</button>
                <button onclick="filtrarEquipo('CA Osasuna')" title="CA Osasuna" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-red-500 text-[10px] font-bold rounded-lg border border-slate-800">OSA</button>
                <button onclick="filtrarEquipo('CD Leganés')" title="CD Leganés" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-300 text-[10px] font-bold rounded-lg border border-slate-800">LEG</button>
                <button onclick="filtrarEquipo('Celta de Vigo')" title="Celta de Vigo" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-sky-400 text-[10px] font-bold rounded-lg border border-slate-800">CEL</button>
                <button onclick="filtrarEquipo('Deportivo Alavés')" title="Deportivo Alavés" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-400 text-[10px] font-bold rounded-lg border border-slate-800">ALA</button>
                <button onclick="filtrarEquipo('FC Barcelona')" title="FC Barcelona" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-400 text-[10px] font-bold rounded-lg border border-slate-800">BAR</button>
                <button onclick="filtrarEquipo('Getafe CF')" title="Getafe CF" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-500 text-[10px] font-bold rounded-lg border border-slate-800">GET</button>
                <button onclick="filtrarEquipo('Girona FC')" title="Girona FC" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-red-400 text-[10px] font-bold rounded-lg border border-slate-800">GIR</button>
                <button onclick="filtrarEquipo('Rayo Vallecano')" title="Rayo Vallecano" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-red-500 text-[10px] font-bold rounded-lg border border-slate-800">RAY</button>
                <button onclick="filtrarEquipo('RCD Espanyol')" title="RCD Espanyol" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-400 text-[10px] font-bold rounded-lg border border-slate-800">ESP</button>
                <button onclick="filtrarEquipo('RCD Mallorca')" title="RCD Mallorca" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-red-500 text-[10px] font-bold rounded-lg border border-slate-800">MALL</button>
                <button onclick="filtrarEquipo('Real Betis')" title="Real Betis" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-emerald-400 text-[10px] font-bold rounded-lg border border-slate-800">BET</button>
                <button onclick="filtrarEquipo('Real Madrid')" title="Real Madrid" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-amber-300 text-[10px] font-bold rounded-lg border border-slate-800">RMA</button>
                <button onclick="filtrarEquipo('Real Sociedad')" title="Real Sociedad" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-blue-300 text-[10px] font-bold rounded-lg border border-slate-800">RSO</button>
                <button onclick="filtrarEquipo('Real Valladolid')" title="Real Valladolid" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-purple-400 text-[10px] font-bold rounded-lg border border-slate-800">VLL</button>
                <button onclick="filtrarEquipo('Sevilla FC')" title="Sevilla FC" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-slate-200 text-[10px] font-bold rounded-lg border border-slate-800">SEV</button>
                <button onclick="filtrarEquipo('UD Las Palmas')" title="UD Las Palmas" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-yellow-400 text-[10px] font-bold rounded-lg border border-slate-800">LPA</button>
                <button onclick="filtrarEquipo('Valencia CF')" title="Valencia CF" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-orange-400 text-[10px] font-bold rounded-lg border border-slate-800">VAL</button>
                <button onclick="filtrarEquipo('Villarreal CF')" title="Villarreal CF" class="w-full py-1.5 bg-slate-950 hover:bg-slate-800 text-yellow-300 text-[10px] font-bold rounded-lg border border-slate-800">VIL</button>
            </div>
        </aside>

        <!-- CONTENIDO CENTRAL: TABLA DE JUGADORES -->
        <main class="flex-1 space-y-4">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-lg font-bold text-white">Chollos La Liga Fantasy — Todos los Jugadores</h1>
                    <p id="contador" class="text-xs text-slate-400">Cargando base de datos...</p>
                </div>
                <input type="text" id="filtro-nombre" oninput="aplicarFiltros()" placeholder="Buscar jugador..." class="w-full md:w-64 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase tracking-wider">
                        <tr>
                            <th class="px-4 py-3">Jugador</th>
                            <th class="px-4 py-3">Equipo</th>
                            <th class="px-4 py-3 text-center">Posición</th>
                            <th class="px-4 py-3 text-right">Valor Mercado</th>
                            <th class="px-4 py-3 text-right">Subida / Bajada</th>
                            <th class="px-4 py-3 text-center">Media Pts</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-slate-800/60 text-slate-300">
                        <!-- Filas -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let todosJugadores = [];
        let equipoSeleccionado = 'todos';

        async function cargarDatos() {
            try {
                const res = await fetch('./datos.json?v=' + new Date().getTime());
                if (res.ok) {
                    const data = await res.json();
                    todosJugadores = data.laliga.chollos || [];
                    aplicarFiltros();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function filtrarEquipo(eq) {
            equipoSeleccionado = eq;
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const busqueda = document.getElementById('filtro-nombre')?.value.toLowerCase().trim() || '';

            const resultados = todosJugadores.filter(j => {
                const coincideNombre = j.nombre.toLowerCase().includes(busqueda);
                const coincideEquipo = equipoSeleccionado === 'todos' || j.equipo === equipoSeleccionado;
                return coincideNombre && coincideEquipo;
            });

            document.getElementById('contador').innerText = `${resultados.length} Jugadores en la base de datos`;

            const cuerpo = document.getElementById('tabla-cuerpo');
            if (!cuerpo) return;

            if (resultados.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No hay jugadores disponibles.</td></tr>`;
                return;
            }

            cuerpo.innerHTML = resultados.map(j => {
                const esSubida = j.subida.includes('+');
                return `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 font-bold text-white flex items-center gap-2">
                            <span>⚽</span> ${j.nombre}
                        </td>
                        <td class="px-4 py-3 text-slate-400 font-medium">${j.equipo}</td>
                        <td class="px-4 py-3 text-center">
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] px-2 py-0.5 rounded-md font-bold">${j.pos}</span>
                        </td>
                        <td class="px-4 py-3 text-right font-bold text-white">${j.precio}</td>
                        <td class="px-4 py-3 text-right font-bold ${esSubida ? 'text-emerald-400' : 'text-red-400'}">${j.subida}</td>
                        <td class="px-4 py-3 text-center font-bold text-amber-400">${j.pts}</td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
