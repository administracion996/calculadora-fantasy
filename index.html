<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyHub - Analítica y Estadísticas LaLiga</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header principal -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 font-extrabold text-xl text-emerald-400">
                <span class="text-2xl">📊</span> Analítica FantasyHub
            </div>
            <div class="flex gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button id="btn-biwenger" onclick="cambiarJuego('biwenger')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition">Biwenger</button>
                <button id="btn-laliga" onclick="cambiarJuego('laliga')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">LaLiga Fantasy</button>
                <button id="btn-comunio" onclick="cambiarJuego('comunio')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">Comunio</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8 space-y-6">
        
        <!-- Panel de Filtros -->
        <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    🔍 Mercado & Estadísticas de Jugadores
                </h1>
                <span id="contador-resultados" class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                    Cargando base de datos...
                </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <!-- Buscador Nombre -->
                <div>
                    <label class="text-xs font-medium text-slate-400">Buscar por nombre</label>
                    <input type="text" id="filtro-nombre" oninput="aplicarFiltros()" placeholder="Ej: Yamal, Mbappé, Pedri..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Filtro Equipo -->
                <div>
                    <label class="text-xs font-medium text-slate-400">Equipo</label>
                    <select id="filtro-equipo" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todos">Todos los equipos (20)</option>
                        <option value="Athletic Club">Athletic Club</option>
                        <option value="Atlético de Madrid">Atlético de Madrid</option>
                        <option value="CA Osasuna">CA Osasuna</option>
                        <option value="CD Leganés">CD Leganés</option>
                        <option value="Celta de Vigo">Celta de Vigo</option>
                        <option value="Deportivo Alavés">Deportivo Alavés</option>
                        <option value="FC Barcelona">FC Barcelona</option>
                        <option value="Getafe CF">Getafe CF</option>
                        <option value="Girona FC">Girona FC</option>
                        <option value="Rayo Vallecano">Rayo Vallecano</option>
                        <option value="RCD Espanyol">RCD Espanyol</option>
                        <option value="RCD Mallorca">RCD Mallorca</option>
                        <option value="Real Betis">Real Betis</option>
                        <option value="Real Madrid">Real Madrid</option>
                        <option value="Real Sociedad">Real Sociedad</option>
                        <option value="Real Valladolid">Real Valladolid</option>
                        <option value="Sevilla FC">Sevilla FC</option>
                        <option value="UD Las Palmas">UD Las Palmas</option>
                        <option value="Valencia CF">Valencia CF</option>
                        <option value="Villarreal CF">Villarreal CF</option>
                    </select>
                </div>

                <!-- Filtro Posición -->
                <div>
                    <label class="text-xs font-medium text-slate-400">Posición</label>
                    <select id="filtro-posicion" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todas">Todas las posiciones</option>
                        <option value="POR">Portero (POR)</option>
                        <option value="DEF">Defensa (DEF)</option>
                        <option value="MED">Centrocampista (MED)</option>
                        <option value="DEL">Delantero (DEL)</option>
                    </select>
                </div>

                <!-- Tendencia Mercado -->
                <div>
                    <label class="text-xs font-medium text-slate-400">Tendencia Mercado</label>
                    <select id="filtro-tendencia" onchange="aplicarFiltros()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="todos">Todas las tendencias</option>
                        <option value="subida">🔥 En Subida de valor</option>
                        <option value="bajada">📉 En Bajada de valor</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Tabla Estilo Analítica Fantasy -->
        <section class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-xs text-slate-400 uppercase tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="px-4 py-3.5">Jugador</th>
                            <th class="px-4 py-3.5">Equipo</th>
                            <th class="px-4 py-3.5 text-center">Posición</th>
                            <th class="px-4 py-3.5 text-right">Valor Mercado</th>
                            <th class="px-4 py-3.5 text-right">Tendencia Hoy</th>
                            <th class="px-4 py-3.5 text-center">Media Pts</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-slate-800/60">
                        <!-- Filas renderizadas con JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        let datosGlobales = {};
        let plataformaActual = 'biwenger';

        async function cargarDatosEstadisticas() {
            try {
                const res = await fetch('./datos.json?v=' + new Date().getTime());
                if (res.ok) {
                    datosGlobales = await res.json();
                    cambiarJuego('biwenger');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function cambiarJuego(juego) {
            plataformaActual = juego;

            ['biwenger', 'laliga', 'comunio'].forEach(j => {
                const btn = document.getElementById(`btn-${j}`);
                if (btn) {
                    if (j === juego) {
                        btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition";
                    } else {
                        btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition";
                    }
                }
            });

            aplicarFiltros();
        }

        function aplicarFiltros() {
            if (!datosGlobales[plataformaActual] || !datosGlobales[plataformaActual].chollos) return;

            const textoBusqueda = document.getElementById('filtro-nombre')?.value.toLowerCase().trim() || '';
            const equipoSel = document.getElementById('filtro-equipo')?.value || 'todos';
            const posicionSel = document.getElementById('filtro-posicion')?.value || 'todas';
            const tendenciaSel = document.getElementById('filtro-tendencia')?.value || 'todos';

            const lista = datosGlobales[plataformaActual].chollos;

            const resultados = lista.filter(j => {
                const coincideNombre = (j.nombre || '').toLowerCase().includes(textoBusqueda);
                const coincideEquipo = equipoSel === 'todos' || j.equipo === equipoSel;
                const coincidePos = posicionSel === 'todas' || j.pos === posicionSel;

                let coincideTendencia = true;
                if (tendenciaSel === 'subida') coincideTendencia = (j.subida || '').includes('+');
                if (tendenciaSel === 'bajada') coincideTendencia = (j.subida || '').includes('-');

                return coincideNombre && coincideEquipo && coincidePos && coincideTendencia;
            });

            const contador = document.getElementById('contador-resultados');
            if (contador) contador.innerText = `${resultados.length} Jugadores analizados en ${plataformaActual.toUpperCase()}`;

            const cuerpo = document.getElementById('tabla-cuerpo');
            if (cuerpo) {
                if (resultados.length === 0) {
                    cuerpo.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No se encontraron jugadores con los filtros seleccionados.</td></tr>`;
                    return;
                }

                cuerpo.innerHTML = resultados.map(j => {
                    const esSubida = (j.subida || '').includes('+');
                    return `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="px-4 py-3 font-bold text-white flex items-center gap-2">
                                <span>⚽</span> ${j.nombre}
                            </td>
                            <td class="px-4 py-3 text-slate-400">${j.equipo}</td>
                            <td class="px-4 py-3 text-center">
                                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2 py-0.5 rounded-md font-bold">${j.pos}</span>
                            </td>
                            <td class="px-4 py-3 text-right font-bold text-slate-200">${j.precio}</td>
                            <td class="px-4 py-3 text-right font-bold ${esSubida ? 'text-emerald-400' : 'text-red-400'}">
                                ${j.subida}
                            </td>
                            <td class="px-4 py-3 text-center font-bold text-amber-400">${j.pts}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        window.onload = cargarDatosEstadisticas;
    </script>
</body>
</html>
